[project]
name = "thirdplace-backend"
version = "0.0.0"
description = "ThirdPlace backend — scoring / ranking service (Phase 0 foundation)."
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "celery>=5.4,<6",
    "redis>=5.2,<6",
    "supabase>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<0.28",
    "ruff>=0.8,<0.9",
    "black>=24.10,<25",
    "mypy>=1.13,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend"]

[tool.ruff]
target-version = "py39"
line-length = 88
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# UP007 (Optional[X] -> X | Y) is unsafe under our 3.9 runtime target because
# pydantic evaluates annotations at runtime; keep explicit Optional[...].
ignore = ["UP007"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["backend", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
