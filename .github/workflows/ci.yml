name: backend-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: Mypy (types)
        run: mypy

      - name: Pytest (unit)
        run: pytest

      # Migration + security checks and the full 435-scenario contract suite
      # (Gate 7/8) activate when the V2.2 schema and scenario registry are
      # imported. They are BLOCKED_CONTRACT_GAP until then.
      - name: Contract / migration / scenario suite (placeholder)
        run: echo "No V2.2 schema or 435-scenario registry imported — contract/migration/scenario CI not applicable (BLOCKED_CONTRACT_GAP)."
